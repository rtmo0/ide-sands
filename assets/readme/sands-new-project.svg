<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#548af7"/></marker></defs>
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#1e1f22"/>
<text x="40" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="650" fill="#dfe1e5" text-anchor="start">From repository to a working project</text>
<text x="40" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9da0a8" text-anchor="start">One dialog in Sands. Nothing is installed on your machine.</text>
<rect x="40" y="118" width="190" height="270" rx="12" fill="#2b2d30" stroke="#4e5157" stroke-width="1.5"/>
<circle cx="70" cy="152" r="15" fill="#d9a55b"/>
<text x="70" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1f22" text-anchor="middle">1</text>
<text x="94" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#dfe1e5" text-anchor="start">New Project</text>
<text x="62" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">Name it, or keep the</text>
<text x="62" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">repository name.</text>
<rect x="488" y="118" width="210" height="270" rx="12" fill="#2b2d30" stroke="#4e5157" stroke-width="1.5"/>
<circle cx="518" cy="152" r="15" fill="#d9a55b"/>
<text x="518" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1f22" text-anchor="middle">3</text>
<text x="542" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#dfe1e5" text-anchor="start">Sandbox</text>
<text x="510" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">A microVM with its own</text>
<text x="510" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">Docker and network</text>
<text x="510" y="238" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">policy.</text>
<rect x="729" y="118" width="210" height="270" rx="12" fill="#2b2d30" stroke="#4e5157" stroke-width="1.5"/>
<circle cx="759" cy="152" r="15" fill="#d9a55b"/>
<text x="759" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1f22" text-anchor="middle">4</text>
<text x="783" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#dfe1e5" text-anchor="start">Agents</text>
<text x="751" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">Claude Code, Codex,</text>
<text x="751" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">Gemini, OpenCode…</text>
<text x="751" y="238" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">now or later, inside</text>
<text x="751" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">the sandbox.</text>
<rect x="970" y="118" width="190" height="270" rx="12" fill="#2b2d30" stroke="#4e5157" stroke-width="1.5"/>
<circle cx="1000" cy="152" r="15" fill="#d9a55b"/>
<text x="1000" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1f22" text-anchor="middle">5</text>
<text x="1024" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#dfe1e5" text-anchor="start">Open</text>
<text x="992" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">Projects on the left,</text>
<text x="992" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">code, database and</text>
<text x="992" y="238" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">services on the right.</text>
<rect x="261" y="118" width="196" height="270" rx="12" fill="#2b2d30" stroke="#4e5157" stroke-width="1.5"/>
<circle cx="291" cy="152" r="15" fill="#d9a55b"/>
<text x="291" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1f22" text-anchor="middle">2</text>
<text x="315" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#dfe1e5" text-anchor="start">Code</text>
<rect x="275" y="178" width="168" height="110" rx="8" fill="#393b40"/>
<text x="287" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#d9a55b" text-anchor="start">Local Git repo</text>
<text x="287" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9da0a8" text-anchor="start">read-only mount,</text>
<text x="287" y="239" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9da0a8" text-anchor="start">private clone inside,</text>
<text x="287" y="258" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9da0a8" text-anchor="start">commits come back as</text>
<text x="287" y="277" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9da0a8" text-anchor="start">remote sandbox-&lt;name&gt;</text>
<rect x="275" y="298" width="168" height="72" rx="8" fill="#393b40"/>
<text x="287" y="320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#d9a55b" text-anchor="start">Git URL</text>
<text x="287" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9da0a8" text-anchor="start">cloned inside</text>
<text x="287" y="359" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9da0a8" text-anchor="start">the sandbox</text>
<line x1="232" y1="253.0" x2="255" y2="253.0" stroke="#548af7" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="459" y1="253.0" x2="482" y2="253.0" stroke="#548af7" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="700" y1="253.0" x2="723" y2="253.0" stroke="#548af7" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="941" y1="253.0" x2="964" y2="253.0" stroke="#548af7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9da0a8" text-anchor="start">Each new project gets a separate sandbox, so one project's agents, services and secrets never reach another.</text>
</svg>
